name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: astrbot_plugin_deepseek_search
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r astrbot_plugin_deepseek_search/requirements.txt
      - run: python -m unittest discover -s astrbot_plugin_deepseek_search/tests -v

  astrbot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: astrbot_plugin_deepseek_search
          persist-credentials: false
      - name: Test with AstrBot 4.25.1
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD:/workspace" -w /workspace
          -e PYTHONPATH=/AstrBot:/workspace -e REQUIRE_ASTRBOT_TESTS=1
          soulter/astrbot:v4.25.1
          -m unittest discover -s astrbot_plugin_deepseek_search/tests -v

  package:
    needs: [unit, astrbot]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          path: astrbot_plugin_deepseek_search
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and check tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            python astrbot_plugin_deepseek_search/build.py --expected-version "$REF_NAME"
          else
            python astrbot_plugin_deepseek_search/build.py
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-search-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
